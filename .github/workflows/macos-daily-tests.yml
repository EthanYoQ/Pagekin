name: macOS daily tests

# PR CI 只跑 Windows；这里每天在 master 上跑一次 macOS 全量 node vitest，
# 让 macOS 特有的失败不必等到发版前的打包资格构建才暴露。不拦 PR，不进必需检查。
on:
  schedule:
    # UTC 18:17 是北京时间 02:17：维护者早上能看到结果，也避开整点的排队高峰。
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-daily-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: macOS node tests
    # arm64，与 macos-arm64-cloud-build.yml 同一镜像；作者多用 Apple 芯片，macOS 失败的旁证也来自这台 runner。
    runs-on: macos-15
    # 同镜像上全量 vitest 约 7.5 分钟（run 45045463253 记录 446s），加安装与 helper 编译留足余量。
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Record tested commit
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UNIT_REPORT=$RUNNER_TEMP/macos-vitest-results.json" >> "$GITHUB_ENV"
          echo "CI_TESTED_COMMIT=$(git rev-parse HEAD) arch=$(uname -m)"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # GitHub 的发布文件下载偶发 5xx，重试只包这一次下载，免得每天出假红。
      - name: Download Electron binary
        timeout-minutes: 5
        run: |
          for wait in 10 20 40 80 0; do
            node node_modules/electron/install.js && exit 0
            [ "$wait" = 0 ] && break
            echo "Electron download failed; retrying in ${wait}s."
            sleep "$wait"
          done
          echo "::error::Electron download failed after 5 attempts."
          exit 1

      - name: Run dependency build scripts
        run: pnpm rebuild

      - name: Build native secure helper for macOS tests
        run: |
          clang -fobjc-arc -framework Foundation electron/security/darwin-safe-file-system.m -o electron/security/darwin-safe-file-system
          chmod +x electron/security/darwin-safe-file-system

      # /var 是 /private/var 的别名，安全文件层按真实路径比对。
      - name: Resolve macOS test temp directory
        run: |
          node -e "const fs = require('node:fs'); const os = require('node:os'); const original = os.tmpdir(); const physical = fs.realpathSync.native(original); fs.appendFileSync(process.env.GITHUB_ENV, 'TMPDIR=' + physical + '\n'); console.log('tempAlias=' + (physical !== original))"

      - name: Run node test suite
        run: pnpm test --reporter=default --reporter=json --outputFile.json="$UNIT_REPORT"

      - name: Upload vitest report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-daily-vitest-report
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ env.UNIT_REPORT }}
